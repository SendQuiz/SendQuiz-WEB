services:
  send-web:
    image: ${SEND_WEB_IMAGE:?SEND_WEB_IMAGE is required}
    container_name: send-web
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=512
    expose:
      - "3000"
    networks:
      - edge
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  edge:
    external: true
  database:
    external: true
