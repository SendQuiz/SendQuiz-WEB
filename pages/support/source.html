<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SEND 고객센터</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
        margin: 0;
        padding: 0;
        background: #f6f6f7;
        color: #1f2933;
      }
      .support {
        max-width: 680px;
        margin: 64px auto;
        padding: 32px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(31, 41, 51, 0.12);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 0 0 20px;
        color: #52606d;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      textarea {
        width: 100%;
        min-height: 160px;
        padding: 12px 14px;
        border: 1px solid #d9e2ec;
        border-radius: 10px;
        font-size: 15px;
        resize: vertical;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 16px;
      }
      button {
        padding: 10px 20px;
        border-radius: 999px;
        border: none;
        background: #1f7aec;
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #status {
        margin-top: 16px;
        font-size: 14px;
      }
      #status.error {
        color: #d64545;
      }
      #status.success {
        color: #12805c;
      }
    </style>
  </head>
  <body>
    <main class="support">
      <h1>고객센터 지원문의</h1>
      <p>문의 내용을 남겨주시면 빠르게 확인하고 안내드리겠습니다.</p>
      <form id="support-form">
        <label for="message">문의 내용</label>
        <textarea
          id="message"
          name="message"
          placeholder="문의하실 내용을 입력해 주세요."
          required
        ></textarea>
        <div class="actions">
          <button type="submit" id="submit-button">제출</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="/support/assets/support.js"></script>
  </body>
</html>
